<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>관리자 · 덕수궁 잃어버린 반쪽을 찾아라</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
// 새 버전 자동 반영 (index.html 과 같은 version.json 사용)
const APP_VERSION = '13';
fetch('version.json', { cache: 'no-store' }).then((r) => r.json()).then(({ v }) => {
  const u = new URL(location.href);
  if (v !== APP_VERSION && u.searchParams.get('v') !== v) { u.searchParams.set('v', v); location.replace(u); }
}).catch(() => {});
</script>
<style>
  :root { --bg: #f5f2ec; --ink: #1d2622; --ink-2: #5b6661; --ink-3: #98a19c; --line: #e7e2d8; --brand: #1f5d43; --brand-soft: #e5efe9; --danger: #c2413b; --gold: #b8892b;
          --shadow: 0 1px 2px rgba(29,38,34,.04), 0 8px 24px -12px rgba(29,38,34,.18); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif; color: var(--ink); background: var(--bg); letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: max(12px, env(safe-area-inset-top)) 16px 12px; background: rgba(245,242,236,.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 16px; font-weight: 800; }
  header h1 small { display: block; font-size: 12px; font-weight: 600; color: var(--ink-3); }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }

  .btn { border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: #fff; }
  .btn.danger { color: var(--danger); border-color: #f0d3d1; background: #fff; }
  .btn.sm { padding: 7px 11px; font-size: 13px; border-radius: 10px; }

  .login { max-width: 380px; margin: 56px auto; background: #fff; border-radius: 20px; padding: 26px 22px; box-shadow: var(--shadow); }
  .login h2 { margin: 0 0 18px; font-size: 20px; font-weight: 800; }
  .login label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 12px 0 6px; }
  .login input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #faf9f6; font-size: 16px; }
  .login .btn { width: 100%; margin-top: 18px; padding: 13px; font-size: 16px; }
  .err { color: var(--danger); font-size: 14px; min-height: 20px; margin-top: 10px; }

  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  .stat { background: #fff; border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12.5px; color: var(--ink-2); }

  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .tools input { grid-column: 1 / -1; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font-size: 15px; }
  @media (min-width: 640px) { .tools { grid-template-columns: 2fr repeat(5, auto); } .tools input { grid-column: auto; } }
  .updated { font-size: 12px; color: var(--ink-3); margin: 0 0 14px; line-height: 1.5; }

  .list { display: grid; gap: 12px; }
  .team { background: #fff; border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
  .team-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .team-head .l { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .rank { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 800; background: #f1efe9; color: var(--ink-2); }
  .rank.r1 { background: #f2c94c; color: #5a4300; } .rank.r2 { background: #d5d9dd; color: #3d464d; } .rank.r3 { background: #e0a878; color: #5a3010; } .rank.sp { background: #e8d9f7; color: #5a2d8a; }
  .team-head .name { font-size: 17px; font-weight: 800; }
  .team-head .meta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .pill { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: #f1efe9; color: var(--ink-2); white-space: nowrap; }
  .pill.ok { background: var(--brand-soft); color: var(--brand); }
  .scorebox { display: flex; align-items: center; gap: 12px; background: #f8f6f1; border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
  .scorebox .tot { white-space: nowrap; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .scorebox .tot small { font-size: 13px; font-weight: 600; color: var(--ink-3); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--ink-2); }
  .chips b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .chips .wit { color: #6b3fa0; }
  .pending { font-size: 12.5px; color: var(--ink-3); }
  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .th { position: relative; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; background: #f3f1ec; border: 0; padding: 0; cursor: zoom-in; }
  .th img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .th .lb { position: absolute; left: 6px; top: 6px; background: rgba(20,24,22,.66); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 999px; }
  .th .sc { position: absolute; right: 6px; bottom: 6px; background: #fff; color: var(--ink); font-size: 12px; font-weight: 800; padding: 3px 7px; border-radius: 999px; box-shadow: var(--shadow); }
  .th.none { display: grid; place-items: center; color: var(--ink-3); font-size: 12px; cursor: default; }
  .team-actions { display: flex; gap: 8px; margin-top: 10px; }
  .team-actions .btn:first-child { flex: 1; }
  .empty { padding: 48px 16px; text-align: center; color: var(--ink-3); background: #fff; border-radius: 18px; }

  /* 시트(모달) */
  .sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(15,18,17,.55); display: none; align-items: flex-end; justify-content: center; }
  .sheet-wrap.open { display: flex; }
  @media (min-width: 640px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 22px !important; } }
  .sheet { background: #fff; width: min(100%, 560px); max-height: 94vh; overflow: auto; border-radius: 22px 22px 0 0; padding: 18px 16px max(18px, env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 2px 0 6px; font-size: 18px; font-weight: 800; }
  .sheet p { margin: 0 0 14px; font-size: 14px; color: var(--ink-2); line-height: 1.6; word-break: keep-all; }
  .sheet .view { width: 100%; border-radius: 12px; display: block; margin-bottom: 12px; background: #f3f1ec; min-height: 200px; }
  .sheet .row { display: flex; gap: 8px; }
  .sheet .row .btn { flex: 1; padding: 13px; font-size: 15px; }
  .batches { display: grid; gap: 8px; margin-bottom: 10px; }
  .batches .btn { padding: 13px; font-size: 15px; }
  .batches .btn.done { background: var(--brand-soft); border-color: var(--brand-soft); color: var(--brand); }

  .detail { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
  .detail .hd { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #f8f6f1; font-weight: 800; }
  .detail .hd span:last-child { font-size: 20px; }
  .detail dl { margin: 0; }
  .detail .it { padding: 9px 12px; border-top: 1px solid var(--line); font-size: 13px; line-height: 1.5; }
  .detail .it dt { display: flex; justify-content: space-between; font-weight: 700; }
  .detail .it dd { margin: 2px 0 0; color: var(--ink-2); }
  .detail .sum { padding: 10px 12px; border-top: 1px solid var(--line); font-size: 13.5px; background: #fffdf6; }
  .detail .model { padding: 6px 12px 10px; font-size: 11px; color: var(--ink-3); }
  .field { display: grid; gap: 6px; margin-bottom: 12px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .field select { padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font-size: 15px; font-weight: 600; color: var(--ink); }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; z-index: 30; background: var(--ink); color: #fff; font-size: 14px; font-weight: 600; padding: 12px 18px; border-radius: 999px; transition: .25s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header>
  <h1>관리자<small>덕수궁 잃어버린 반쪽을 찾아라</small></h1>
  <button class="btn sm" id="logout" hidden>로그아웃</button>
</header>

<main>
  <form class="login" id="loginForm" hidden>
    <h2>관리자 로그인</h2>
    <label for="email">이메일</label>
    <input type="email" id="email" autocomplete="username" required>
    <label for="pw">비밀번호</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <button class="btn primary">로그인</button>
    <div class="err" id="loginErr"></div>
  </form>

  <section id="board" hidden>
    <div class="stats">
      <div class="stat"><b id="sPeople">0</b><span>참가 조(기기)</span></div>
      <div class="stat"><b id="sDone">0</b><span>6장 모두 전송</span></div>
      <div class="stat"><b id="sPhotos">0</b><span>받은 사진</span></div>
      <div class="stat"><b id="sScored">0</b><span>AI 채점 완료</span></div>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="조 이름 검색">
      <button class="btn primary" id="scoreAll">AI 채점</button>
      <button class="btn gold" id="openResults">결과 발표 이미지</button>
      <button class="btn" id="reload">새로고침</button>
      <button class="btn" id="saveAll">전체 사진 저장</button>
      <button class="btn danger" id="delAll">전체 삭제</button>
    </div>
    <p class="updated" id="updated"></p>
    <div class="list" id="list"></div>
  </section>

  <p class="empty" id="noConfig" hidden>config.js 에 Supabase 연결 정보가 없습니다.</p>
</main>

<!-- 사진 크게 보기 + 채점 상세 -->
<div class="sheet-wrap" id="viewer">
  <div class="sheet">
    <h3 id="viewTitle"></h3>
    <img class="view" id="viewImg" alt="">
    <div id="viewScore"></div>
    <div class="row">
      <button class="btn" id="viewClose">닫기</button>
      <button class="btn" id="viewRescore">다시 채점</button>
      <button class="btn primary" id="viewSave" disabled>불러오는 중…</button>
    </div>
  </div>
</div>

<!-- 여러 장 저장 -->
<div class="sheet-wrap" id="saver">
  <div class="sheet">
    <h3 id="saverTitle">사진 저장</h3>
    <p id="saverMsg"></p>
    <div class="batches" id="batches"></div>
    <div class="row"><button class="btn" id="saverClose">닫기</button></div>
  </div>
</div>

<!-- 결과 발표 이미지 -->
<div class="sheet-wrap" id="results">
  <div class="sheet">
    <h3>결과 발표 이미지</h3>
    <p>AI 채점 점수로 순위를 정했어요. 특별상(재치상)은 1~3등을 제외하고 재치 점수가 가장 높은 조가 자동으로 선택되며, 아래에서 바꿀 수 있어요.</p>
    <label class="field">특별상 (재치상)
      <select id="specialPick"></select>
    </label>
    <img class="view" id="resultImg" alt="결과 발표 이미지">
    <div class="row">
      <button class="btn" id="resultsClose">닫기</button>
      <button class="btn primary" id="resultsSave" disabled>만드는 중…</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js?v=13"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

const CFG = window.APP_CONFIG || {};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safe = (s) => String(s).replace(/[\\/:*?"<>|]/g, '_').trim() || '이름없음';
const fmt = (d) => new Date(d).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const BATCH = 20;   // 휴대폰 공유 메뉴로 한 번에 넘길 사진 수

// 채점 기준 (채점 함수 supabase/functions/score 와 같은 값)
const CRIT = [
  { key: 'alignment',   label: '선 연결',   max: 40 },
  { key: 'perspective', label: '크기·원근', max: 25 },
  { key: 'color',       label: '색감·밝기', max: 15 },
  { key: 'teamwork',    label: '조원 참여', max: 20 },
];
const WIT = { key: 'wit', label: '재치', max: 20 };
const MIDS = [1, 2, 3, 4, 5, 6];   // 미션 번호 (참가자 페이지 MISSIONS 와 같게)
const N = MIDS.length;
const PRIZES = [
  { tag: '1등', prize: '올리브영 상품권 3만원', color: '#e2b23a' },
  { tag: '2등', prize: '올리브영 상품권 2만원', color: '#9aa5ad' },
  { tag: '3등', prize: '올리브영 상품권 1만원', color: '#c98a55' },
];
const SPECIAL = { tag: '특별상', sub: '재치상', prize: '올리브영 상품권 1만원', color: '#8a5cc2' };

if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) {
  $('#noConfig').hidden = false;
  throw new Error('no config');
}
const sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
let people = [];
let ranked = [];

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2600);
}

// 휴대폰(공유 메뉴로 사진첩 저장 가능)인지
const canShareFiles = (() => {
  try { return !!navigator.canShare?.({ files: [new File([''], 'a.jpg', { type: 'image/jpeg' })] }); }
  catch { return false; }
})();

/* ---------- 로그인 ---------- */
async function showSession() {
  const { data: { session } } = await sb.auth.getSession();
  $('#loginForm').hidden = !!session;
  $('#board').hidden = !session;
  $('#logout').hidden = !session;
  if (session) load();
}
$('#loginForm').onsubmit = async (e) => {
  e.preventDefault();
  $('#loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value, password: $('#pw').value });
  if (error) { $('#loginErr').textContent = '로그인 실패: 이메일 또는 비밀번호를 확인하세요.'; return; }
  $('#pw').value = '';
  showSession();
};
$('#logout').onclick = async () => { await sb.auth.signOut(); showSession(); };

/* ---------- 점수 계산 ---------- */
// 조 점수 = 미션 6장 점수의 평균 (빠진 미션은 0점). 세부 항목도 같은 방식
function teamScore(p) {
  const sum = { total: 0, wit: 0 };
  CRIT.forEach((c) => { sum[c.key] = 0; });
  let scored = 0, photos = 0;
  for (const m of MIDS) {
    const r = p.missions[m];
    if (!r) continue;
    photos++;
    if (!r.score) continue;
    scored++;
    sum.total += r.score.total;
    sum.wit += r.score.wit;
    CRIT.forEach((c) => { sum[c.key] += r.score[c.key]; });
  }
  const avg = {};
  Object.keys(sum).forEach((k) => { avg[k] = Math.round((sum[k] / N) * 10) / 10; });
  return { ...avg, scored, photos, complete: photos > 0 && scored === photos };
}

// 총점 → 선 연결 → 크기·원근 → 먼저 끝낸 조 순
function rankTeams() {
  const list = people.filter((p) => p.ts.scored > 0);
  list.sort((a, b) => b.ts.total - a.ts.total || b.ts.alignment - a.ts.alignment
    || b.ts.perspective - a.ts.perspective || a.last.localeCompare(b.last));
  list.forEach((p, i) => { p.rank = i + 1; });
  people.filter((p) => !p.ts.scored).forEach((p) => { p.rank = null; });
  return list;
}

function specialPid() {
  const pool = ranked.slice(3);
  const saved = store.get('specialPid');
  if (saved && pool.some((p) => p.pid === saved)) return saved;
  const best = [...pool].sort((a, b) => b.ts.wit - a.ts.wit || b.ts.total - a.ts.total)[0];
  return best?.pid || null;
}

/* ---------- 목록 ---------- */
async function load() {
  $('#list').innerHTML = '<div class="empty">불러오는 중…</div>';
  const [{ data, error }, { data: scores, error: scErr }] = await Promise.all([
    sb.from('submissions').select('*').order('created_at', { ascending: true }),
    sb.from('scores').select('*'),
  ]);
  if (error) { $('#list').innerHTML = `<div class="empty">불러오기 실패: ${esc(error.message)}</div>`; return; }
  const scoreMap = new Map((scores || []).map((s) => [s.submission_id, s]));

  // 기기(참가 조)별로 묶음. 미션마다 가장 최근 사진을 쓰고, 삭제용으로 전체 기록도 보관
  const map = new Map();
  for (const r of data) {
    r.score = scoreMap.get(r.id) || null;
    const p = map.get(r.participant_id) || { pid: r.participant_id, nickname: r.nickname, missions: {}, rows: [], last: r.created_at };
    p.nickname = r.nickname;
    p.missions[r.mission] = r;
    p.rows.push(r);
    p.last = r.created_at;
    map.set(r.participant_id, p);
  }
  people = [...map.values()];
  people.forEach((p) => { p.ts = teamScore(p); });
  ranked = rankTeams();
  people.sort((a, b) => (a.rank ?? 1e9) - (b.rank ?? 1e9) || b.last.localeCompare(a.last));

  const paths = people.flatMap((p) => Object.values(p.missions).map((r) => r.thumb_path));
  const urls = {};
  for (let i = 0; i < paths.length; i += 100) {
    const { data: signed } = await sb.storage.from('photos').createSignedUrls(paths.slice(i, i + 100), 3600);
    signed?.forEach((s) => { if (s.signedUrl) urls[s.path] = s.signedUrl; });
  }
  people.forEach((p) => Object.values(p.missions).forEach((r) => { r.thumbUrl = urls[r.thumb_path]; }));

  const latest = people.flatMap((p) => Object.values(p.missions));
  $('#sPeople').textContent = people.length;
  $('#sDone').textContent = people.filter((p) => MIDS.every((m) => p.missions[m])).length;
  $('#sPhotos').textContent = latest.length;
  $('#sScored').textContent = `${latest.filter((r) => r.score).length}/${latest.length}`;
  $('#updated').textContent = `업데이트 ${new Date().toLocaleTimeString('ko-KR')} · 순위 = 미션 6장 평균 점수(빠진 미션 0점)`
    + (scErr ? ' · ⚠ 점수 표를 불러오지 못했어요 (supabase-scores.sql 실행 필요)' : '');
  render();
}

function chipsHtml(ts) {
  return CRIT.map((c) => `<span>${c.label} <b>${ts[c.key]}</b>/${c.max}</span>`).join('')
    + `<span class="wit">${WIT.label} <b>${ts.wit}</b>/${WIT.max}</span>`;
}

function render() {
  const q = $('#q').value.trim().toLowerCase();
  const list = people.filter((p) => !q || p.nickname.toLowerCase().includes(q));

  $('#list').innerHTML = list.map((p) => {

      return `<button class="th" data-view="${esc(p.pid)}" data-m="${m}"><img src="${esc(r.thumbUrl || '')}" alt="${esc(p.nickname)} 미션 ${m}" loading="lazy"><span class="lb">미션 ${m}</span>${
        r.score ? `<span class="sc">${r.score.total}</span>` : ''}</button>`;
    }).join('');
    const rk = p.rank ? `<span class="rank ${p.rank <= 3 ? 'r' + p.rank : p.pid === sp ? 'sp' : ''}">${p.pid === sp ? '특' : p.rank}</span>` : '';
    const score = p.ts.scored
      ? `<div class="scorebox"><div class="tot">${p.ts.total}<small>점</small></div><div class="chips">${chipsHtml(p.ts)}</div></div>`
      : '';
    const pending = p.ts.scored < p.ts.photos ? `<div class="pending">채점 대기 ${p.ts.photos - p.ts.scored}장 — ‘AI 채점’을 눌러 주세요</div>` : '';
    return `<article class="team">
      <div class="team-head">
        <div class="l">${rk}<div><div class="name">${esc(p.nickname)}</div><div class="meta">${fmt(p.last)} · 기기 ${esc(p.pid.slice(0, 4))}</div></div></div>
        <span class="pill ${n === N ? 'ok' : ''}">${n === N ? N + '장 완료' : n + ' / ' + N}</span>
      </div>
      ${score}${pending}
      <div class="thumbs">${thumbs}</div>
      <div class="team-actions">
        <button class="btn sm" data-save="${esc(p.pid)}">${n}장 ${canShareFiles ? '사진첩에 저장' : '다운로드'}</button>
        <button class="btn sm danger" data-del="${esc(p.pid)}">삭제</button>
      </div>
    </article>`;
  }).join('');
}

/* ---------- AI 채점 ---------- */
async function scoreOne(id, rescore = false) {
  for (let attempt = 0; attempt < 3; attempt++) {
    const { data, error } = await sb.functions.invoke('score', { body: { submission_id: id, rescore } });
    if (!error) return data.score;
    const status = error.context?.status;
    if (status === 429 || status >= 500) { await new Promise((r) => setTimeout(r, 4000 * (attempt + 1))); continue; }
    let msg = error.message;
    try { msg = (await error.context.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  throw new Error('여러 번 시도했지만 채점하지 못했어요');
}

// 각 조·미션의 최신 사진 중 아직 채점되지 않은 것만 채점 (동시에 3장씩)
$('#scoreAll').onclick = () => busy($('#scoreAll'), async (label) => {
  const todo = people.flatMap((p) => Object.values(p.missions)).filter((r) => !r.score);
  if (!todo.length) { toast('채점할 사진이 없어요'); return; }
  let done = 0, failed = 0, lastErr = '';
  label(`채점 중… 0/${todo.length}`);
  const queue = [...todo];
  await Promise.all([0, 1, 2].map(async () => {
    while (queue.length) {
      const r = queue.shift();
      try { await scoreOne(r.id); } catch (e) { failed++; lastErr = e.message; }
      done++;
      label(`채점 중… ${done}/${todo.length}`);
    }
  }));
  await load();
  if (failed) alert(`${failed}장은 채점하지 못했어요. 다시 'AI 채점'을 누르면 남은 사진만 채점해요.\n\n사유: ${lastErr}`);
  else toast(`${todo.length}장 채점 완료`);
});

// 파일 이름에 조 이름·미션 번호를 넣음 (예: 3조_미션1.jpg)
function fileName(p, m, dupe) {
  return `${safe(p.nickname)}${dupe ? '_' + p.pid.slice(0, 4) : ''}_미션${m}.jpg`;
}

async function fetchFile(p, m, dupe = false) {
  const { data, error } = await sb.storage.from('photos').download(p.missions[m].photo_path);
  if (error) throw error;
  return new File([data], fileName(p, m, dupe), { type: 'image/jpeg' });
}

async function collect(ps, onProgress) {
  const names = {};
  ps.forEach((p) => { names[p.nickname] = (names[p.nickname] || 0) + 1; });
  const files = [];
  const total = ps.reduce((n, p) => n + Object.keys(p.missions).length, 0);
  for (const p of ps) {
    for (const m of MIDS) {
      if (!p.missions[m]) continue;
      files.push(await fetchFile(p, m, names[p.nickname] > 1));
      onProgress?.(files.length, total);
    }
  }
  return files;
}

function downloadFile(f) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(f); a.download = f.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

async function shareOrDownload(files) {
  if (canShareFiles) {
    try { await navigator.share({ files }); return true; }
    catch (e) { if (e.name !== 'AbortError') toast('저장하지 못했어요. 다시 눌러 주세요.'); return false; }
  }
  files.forEach(downloadFile);
  return true;
}

// 휴대폰: 공유 메뉴 → "이미지 저장"으로 사진첩에 저장
// (공유 메뉴는 버튼을 누른 직후에만 열 수 있어서, 사진을 먼저 받아두고 저장 버튼을 따로 띄움)
function openSaver(title, files) {
  $('#saverTitle').textContent = title;
  $('#saverMsg').innerHTML = canShareFiles
    ? `사진 ${files.length}장이 준비됐어요. 아래 버튼을 누르고 공유 메뉴에서 <b>“이미지 ${files.length > 1 ? files.length + '개 ' : ''}저장”</b>을 선택하세요.`
    : `사진 ${files.length}장이 준비됐어요.`;
  const groups = [];
  for (let i = 0; i < files.length; i += BATCH) groups.push(files.slice(i, i + BATCH));
  $('#batches').innerHTML = groups.map((g, i) => `<button class="btn primary" data-b="${i}">${
    groups.length > 1 ? `${i * BATCH + 1}~${i * BATCH + g.length}번째 ` : ''}${canShareFiles ? '사진첩에 저장' : '다운로드'} (${g.length}장)</button>`).join('');
  $('#batches').querySelectorAll('[data-b]').forEach((b) => {
    b.onclick = async () => {
      if (await shareOrDownload(groups[+b.dataset.b])) { b.classList.add('done'); b.textContent = '✓ ' + b.textContent; }
    };
  });
  $('#saver').classList.add('open');
}
$('#saverClose').onclick = () => $('#saver').classList.remove('open');

async function busy(btn, fn) {
  const old = btn.textContent;
  btn.disabled = true;
  try { await fn((t) => { btn.textContent = t; }); }
  catch (e) { console.error(e); alert('작업에 실패했어요. 잠시 후 다시 시도해 주세요.\n\n' + (e.message || '')); }
  finally { btn.disabled = false; btn.textContent = old; }
}

let resultFile = null;

async function loadThumb(r) {
  if (!r) return null;
  const { data } = await sb.storage.from('photos').download(r.thumb_path);
  return data ? createImageBitmap(data) : null;
}

function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function fitText(g, text, maxW) {
  if (g.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && g.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}

async function drawResults() {
  await document.fonts.load('800 40px "Pretendard Variable"').catch(() => {});
  const F = (w, s) => `${w} ${s}px "Pretendard Variable", Pretendard, sans-serif`;
  const W = 1080, PAD = 56;
  const spPid = specialPid();
  const top = ranked.slice(0, 3);
  const sp = ranked.find((p) => p.pid === spPid);
  const rest = ranked.filter((p, i) => i >= 3 && p.pid !== spPid);
  const winners = [...top.map((p, i) => ({ p, ...PRIZES[i] })), ...(sp ? [{ p: sp, ...SPECIAL }] : [])];

  const CARD = 340, GAP = 22, ROW = 58;
  const H = 300 + winners.length * (CARD + GAP) + (rest.length ? 120 + rest.length * ROW : 0) + 190;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#f5f2ec'; g.fillRect(0, 0, W, H);

  // 헤더
  g.fillStyle = '#1f5d43'; g.fillRect(0, 0, W, 250);
  g.fillStyle = 'rgba(255,255,255,.75)'; g.font = F(600, 26); g.textBaseline = 'alphabetic';
  g.fillText('KDB생명보험지부 2026 임시대의원대회 1부', PAD, 80);
  g.fillStyle = '#fff'; g.font = F(800, 58);
  g.fillText('덕수궁 잃어버린 반쪽을 찾아라', PAD, 152);
  g.fillStyle = '#f2c94c'; g.font = F(800, 34);
  g.fillText('결과 발표', PAD, 205);

  // 수상 조 카드
  const thumbs = await Promise.all(winners.map((w) => Promise.all(MIDS.map((m) => loadThumb(w.p.missions[m]).catch(() => null)))));
  let y = 290;
  winners.forEach((w, i) => {
    const p = w.p, ts = p.ts;
    g.save();
    g.shadowColor = 'rgba(29,38,34,.12)'; g.shadowBlur = 24; g.shadowOffsetY = 8;
    g.fillStyle = '#fff'; roundRect(g, PAD, y, W - PAD * 2, CARD, 28); g.fill();
    g.restore();
    g.fillStyle = w.color; roundRect(g, PAD, y, 14, CARD, 7); g.fill();

    const x = PAD + 44;
    // 상 이름
    g.fillStyle = w.color; roundRect(g, x, y + 30, w.sub ? 176 : 92, 48, 24); g.fill();
    g.fillStyle = '#fff'; g.font = F(800, 26); g.textAlign = 'center';
    g.fillText(w.sub ? `${w.tag} · ${w.sub}` : w.tag, x + (w.sub ? 88 : 46), y + 63);
    g.textAlign = 'left';
    g.fillStyle = '#5b6661'; g.font = F(600, 22);
    g.fillText(w.prize, x + (w.sub ? 192 : 108), y + 62);

    // 조 이름 + 점수
    g.fillStyle = '#1d2622'; g.font = F(800, 52);
    g.fillText(fitText(g, p.nickname, 420), x, y + 148);
    g.textAlign = 'right';
    g.font = F(800, 64); g.fillStyle = '#1d2622';
    const big = w.sub ? `${ts.wit}` : `${ts.total}`;
    const unit = w.sub ? ` / ${WIT.max} 재치` : ' 점';
    g.font = F(600, 24); const uw = g.measureText(unit).width;
    g.fillStyle = '#98a19c'; g.fillText(unit, W - PAD - 36, y + 148);
    g.font = F(800, 64); g.fillStyle = w.sub ? w.color : '#1d2622';
    g.fillText(big, W - PAD - 36 - uw, y + 148);
    g.textAlign = 'left';

    // 세부 점수
    g.font = F(600, 21); g.fillStyle = '#5b6661';
    const parts = CRIT.map((cr) => `${cr.label} ${ts[cr.key]}/${cr.max}`);
    parts.push(w.sub ? `총점 ${ts.total}/100` : `재치 ${ts.wit}/${WIT.max}`);
    g.fillText(parts.join('   ·   '), x, y + 196);

    // 미션 사진 6장 + 미션별 점수
    const tw = 134, th = 100, ty = y + 218;
    thumbs[i].forEach((bmp, k) => {
      const tx = x + k * (tw + 10);
      g.save(); roundRect(g, tx, ty, tw, th, 12); g.clip();
      g.fillStyle = '#eceae4'; g.fillRect(tx, ty, tw, th);
      if (bmp) {
        const sh = bmp.width * th / tw;   // 사진(아래 글자 띠 제외) 가운데 부분을 잘라서 표시
        const sy = Math.max(0, (bmp.height * 0.92 - sh) / 2);
        g.drawImage(bmp, 0, sy, bmp.width, Math.min(sh, bmp.height), tx, ty, tw, th);
      }
      g.restore();
      const sc = p.missions[MIDS[k]]?.score?.total;
      const tag = `${MIDS[k]} · ${sc ?? '-'}`;
      g.font = F(700, 15);
      const bw = g.measureText(tag).width + 18;
      g.fillStyle = 'rgba(20,24,22,.7)'; roundRect(g, tx + 6, ty + 6, bw, 26, 13); g.fill();
      g.fillStyle = '#fff'; g.fillText(tag, tx + 15, ty + 25);
    });

    y += CARD + GAP;
  });

  // 나머지 조
  if (rest.length) {
    y += 40;
    g.fillStyle = '#1d2622'; g.font = F(800, 30); g.fillText('전체 순위', PAD, y); y += 26;
    g.fillStyle = '#fff'; roundRect(g, PAD, y, W - PAD * 2, rest.length * ROW + 20, 22); g.fill();
    y += 10;
    rest.forEach((p, i) => {
      const cy = y + i * ROW;
      if (i) { g.fillStyle = '#efebe3'; g.fillRect(PAD + 24, cy, W - PAD * 2 - 48, 1); }
      g.fillStyle = '#98a19c'; g.font = F(800, 22); g.textAlign = 'center'; g.fillText(`${p.rank}`, PAD + 48, cy + 37);
      g.textAlign = 'left'; g.fillStyle = '#1d2622'; g.font = F(700, 23); g.fillText(fitText(g, p.nickname, 200), PAD + 88, cy + 37);
      g.fillStyle = '#5b6661'; g.font = F(500, 17);
      g.fillText(CRIT.map((cr) => `${cr.label} ${p.ts[cr.key]}`).join(' · ') + ` · 재치 ${p.ts.wit}`, PAD + 300, cy + 36);
      g.textAlign = 'right'; g.fillStyle = '#1d2622'; g.font = F(800, 24); g.fillText(`${p.ts.total}`, W - PAD - 28, cy + 38); g.textAlign = 'left';
    });
    y += rest.length * ROW + 10;
  }

  // 채점 기준 안내
  y += 46;
  g.fillStyle = '#1d2622'; g.font = F(800, 22); g.fillText('채점 기준', PAD, y);
  g.font = F(500, 19); g.fillStyle = '#5b6661';
  const lines = [
    `${CRIT.map((cr) => `${cr.label} ${cr.max}점`).join(' + ')} = 100점   |   재치 ${WIT.max}점 (특별상 전용, 총점 제외)`,
    '미션 사진마다 AI(Claude)가 같은 기준으로 채점 → 조 점수는 미션 6장 평균 (제출하지 않은 미션은 0점)',
    '동점일 때: 선 연결 → 크기·원근 → 먼저 제출한 조 순   |   특별상: 1~3등을 제외하고 재치 점수가 가장 높은 조',
  ];
  lines.forEach((t, i) => g.fillText(t, PAD, y + 38 + i * 32));

  return new Promise((ok) => c.toBlob(ok, 'image/png'));
}

async function removePaths(paths) {
  for (let i = 0; i < paths.length; i += 100) {
    const { error } = await sb.storage.from('photos').remove(paths.slice(i, i + 100));
    if (error) throw error;
  }
}

async function deletePerson(pid, btn) {
  const p = people.find((x) => x.pid === pid);
  if (!p) return;
  if (!confirm(`'${p.nickname}'의 기록과 사진(점수 포함)을 모두 삭제할까요?\n삭제하면 되돌릴 수 없어요.`)) return;
  await busy(btn, async (label) => {
    label('삭제 중…');
    await removePaths(p.rows.flatMap((r) => [r.photo_path, r.thumb_path]));
    const { error } = await sb.from('submissions').delete().eq('participant_id', pid);
    if (error) throw error;
    toast(`'${p.nickname}' 삭제 완료`);
    await load();
  });
}

// 전체 삭제: 저장소의 모든 사진(전송 중 끊겨 기록 없이 남은 파일 포함)과 모든 기록·점수
$('#delAll').onclick = () => {
  const typed = prompt('모든 조의 기록·사진·점수를 삭제합니다. 되돌릴 수 없어요.\n계속하려면 "전체삭제"를 입력하세요.');
  if (typed === null) return;
  if (typed.replace(/\s/g, '') !== '전체삭제') { alert('입력이 맞지 않아 취소했어요.'); return; }
  busy($('#delAll'), async (label) => {
    label('삭제 중…');
    const { data: folders, error: e1 } = await sb.storage.from('photos').list('', { limit: 1000 });
    if (e1) throw e1;
    const paths = [];
    for (const f of folders || []) {
      const { data: files, error: e2 } = await sb.storage.from('photos').list(f.name, { limit: 1000 });
      if (e2) throw e2;
      (files || []).forEach((x) => paths.push(`${f.name}/${x.name}`));
    }
    await removePaths(paths);
    const { error } = await sb.from('submissions').delete().gt('id', 0);
    if (error) throw error;
    store.set('specialPid', '');
    toast('전체 삭제 완료');
    await load();
  });
};

/* ---------- 목록 클릭 ---------- */
$('#list').onclick = (e) => {
  const v = e.target.closest('[data-view]');
  if (v) return openViewer(v.dataset.view, +v.dataset.m);
  const s = e.target.closest('[data-save]');
  if (s) return savePerson(s.dataset.save, s);
  const d = e.target.closest('[data-del]');
  if (d) return deletePerson(d.dataset.del, d);
};

showSession();
</script>
